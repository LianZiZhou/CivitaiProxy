[package]
name = "civitai-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
brotli = "9.0.0"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
http = "1.5.0"
ipnet = { version = "2.12.2", features = ["serde"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "http2", "charset", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
