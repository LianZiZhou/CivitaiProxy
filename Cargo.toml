[package]
name = "civitai-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["http2", "ws"] }
base64 = "0.23.1"
brotli = "9.0.0"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http2"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "native-tokio", "aws-lc-rs", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "client-proxy", "http1", "http2", "tokio"] }
ipnet = { version = "2.12.2", features = ["serde"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "http2", "charset", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = "1.1.6"
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
