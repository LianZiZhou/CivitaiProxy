# CivitaiProxy 配置示例。复制为 config.toml 后修改。
# 所有项均可省略（使用默认值）；部分项可用环境变量覆盖：
# CP_LISTEN / CP_MODE / CP_PUBLIC_DOMAIN / CP_PUBLIC_SCHEME / CP_UPSTREAM_PROXY /
# CP_ACCESS_ENABLED / CP_ADMIN_TOKEN / CP_WHITELIST_FILE / CP_CONFIG

# 本地监听地址（纯 HTTP，TLS 由前置 Caddy / CDN 终止）
listen = "127.0.0.1:8787"

# "single"  : 单域名，例如 civitai.example.com
#             civitai.com 映射到根路径，其它主机走 /__h/<上游主机>/...
# "wildcard": 泛域名 *.example.com
#             example.com -> civitai.com, image.example.com -> image.civitai.com,
#             其它主机（R2/B2 存储等）走 ext.example.com/<上游主机>/...
mode = "single"

# 用户访问时看到的域名（可带端口）。wildcard 模式下填写根域名，如 "example.com"
public_domain = "civitai.example.com"

# 用户看到的协议（前置反代提供 HTTPS 时为 https）
public_scheme = "https"

# 允许访问的上游主机，"*.x" 同时匹配 x 本身和它的所有子域名，防止被当作开放代理
upstream_allow = [
    "*.civitai.com",
    "*.civitai.green",
    "*.civitai.red",
    "*.r2.cloudflarestorage.com",
    "*.backblazeb2.com",
]

# wildcard 模式：承载“路径编码外部主机”的子域名标签
ext_host = "ext"

# 出站代理（可选），例如 "http://127.0.0.1:7890" 或 "socks5://..."（需 HTTP/HTTPS 代理）
# 未设置时会读取 HTTPS_PROXY / ALL_PROXY 环境变量
# upstream_proxy = "http://127.0.0.1:7890"

connect_timeout_secs = 15
# 上游空闲读超时（大文件下载不受总时长限制）
read_timeout_secs = 300

# 超过此大小的 HTML/JS/JSON 响应不做改写，直接透传
max_rewrite_bytes = 33554432
# 小于此大小的 JSON/表单请求体会把代理域名还原为上游域名
max_request_rewrite_bytes = 4194304
# 是否改写不带协议的裸主机名（如 JS 中的 "civitai.com" 字符串）
rewrite_bare_hosts = true

# wildcard 模式：额外的上游站点映射到独立子域名
[aliases]
"civitai.green" = "civitai-green"
"civitai.red" = "civitai-red"

[access]
# 开启后只有白名单 IP 才能使用代理（/__cp/* 管理接口始终可访问）
enabled = false
# 管理口令：用于 /__cp/allow 等接口与 CLI。留空则禁用管理接口
admin_token = ""
whitelist_file = "whitelist.json"
# 通过 /__cp/allow 加白的默认有效期（秒），0 = 永久
default_ttl_secs = 0
# 只信任来自这些地址的客户端 IP 头（前置 Caddy 所在地址）
trusted_proxies = ["127.0.0.1/32", "::1/128"]
# 真实客户端 IP 所在请求头。直连 Caddy 用 X-Forwarded-For；
# Caddy 前还有 Cloudflare 时可用 CF-Connecting-IP（并确保 Caddy 只接受 CF 回源）
client_ip_header = "X-Forwarded-For"
